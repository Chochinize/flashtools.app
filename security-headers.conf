# Shared security headers, included from both the server block and any
# location block that sets its own add_header (which otherwise suppresses
# inheritance of these from the parent level — see /_astro/ in nginx.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# unsafe-inline is required: this is a static Astro build with no per-request
# nonce generation, and it ships inline <script type="module"> blocks plus
# inline style="--percent:..." attributes. blob: is for the createObjectURL
# previews in ImageConverter/CompareSlider. No third-party origins anywhere,
# matching the "zero third-party requests" brand promise.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
