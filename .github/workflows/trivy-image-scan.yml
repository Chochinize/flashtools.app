# Trivy image scan — shift-left container CVE gate.
#
# Drop this into an image-building repo at: .github/workflows/trivy-image-scan.yml
#
# What it does:
#   1. Builds the image locally (no push) so it scans exactly what would ship.
#   2. GATE: fails the run when the image has a HIGH/CRITICAL vuln that HAS A FIX
#      available (--ignore-unfixed). Unfixable CVEs don't block — you can't act on them.
#   3. RECORD: uploads full results to the Security tab (public repos, or private with
#      GitHub Advanced Security) and always as a downloadable artifact.
#   4. Weekly schedule re-scans unchanged images against newly-disclosed CVEs.
#
# Per-repo knobs: edit the env block if the Dockerfile isn't at the repo root.

name: trivy-image-scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — catch CVEs disclosed since last build

permissions:
  contents: read
  security-events: write   # needed for SARIF upload to the Security tab

env:
  IMAGE_REF: local/scan:${{ github.sha }}
  DOCKERFILE: Dockerfile
  BUILD_CONTEXT: .

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -f "${DOCKERFILE}" -t "${IMAGE_REF}" "${BUILD_CONTEXT}"

      # 1) GATE — fail only on FIXABLE High/Critical
      - name: Trivy gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # 2) RECORD — full SARIF, never blocks the build
      - name: Trivy SARIF (report only)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true   # tolerated: private repos without GitHub Advanced Security can't upload
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload SARIF as artifact (works everywhere)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore
